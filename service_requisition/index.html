<style type="text/tailwindcss">
@layer base{
 body{@apply bg-slate-100 font-sans text-slate-800 antialiased dark:bg-slate-900 dark:text-slate-100;background-image:radial-gradient(60rem 28rem at 10% -10%,rgba(99,102,241,.14),transparent);background-attachment:fixed}

}
@layer components{
 button{@apply inline-flex cursor-pointer items-center justify-center gap-1.5 rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-sm font-medium text-slate-700 shadow-sm transition hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-40 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700}

 td.n,th.n{@apply text-right}td.ac{@apply whitespace-nowrap text-right}
 .b{@apply inline-block min-w-[2.5rem] rounded-full px-2.5 py-0.5 text-center text-xs font-semibold}

 .cc.on{@apply border-indigo-500 bg-indigo-50 ring-2 ring-indigo-200 dark:bg-indigo-900/30 dark:ring-indigo-800}

 .seg{@apply inline-flex rounded-xl bg-white p-1 shadow-sm dark:bg-slate-800}.seg button{@apply rounded-lg border-0 bg-transparent px-3 py-1.5 shadow-none dark:bg-transparent}
 .seg button.on{@apply bg-indigo-600 text-white dark:bg-indigo-600}
 .kpi{@apply flex items-center gap-4 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md dark:border-slate-700 dark:bg-slate-800}
 #cartbar{@apply fixed bottom-5 left-1/2 z-20 -translate-x-1/2 items-center gap-4 whitespace-nowrap rounded-full bg-indigo-600 py-2 pl-5 pr-2 text-sm text-white shadow-xl shadow-indigo-500/40;display:none}
 #cartbar button{@apply rounded-full border-0 bg-white px-4 py-1.5 text-indigo-700 hover:bg-indigo-50}
}

#pr .sg{display:flex;justify-content:space-around;margin-top:60px;text-align:center}#pr .sg div{width:30%}#pr .sg i{display:block;border-top:1px dotted #000;margin-top:40px;padding-top:4px;font-style:normal}}
</style></head><body>
<div id="app"></div><div id="pr"></div><div id="cartbar"></div><div id="toast" class="pointer-events-none fixed right-4 top-4 z-50 flex flex-col gap-2"></div>
<dialog id="dlg"><form method="dialog" id="frm"></form></dialog>
<script>
/* ================= helpers ================= */
const $=s=>document.querySelector(s),v=id=>$("#"+id).value;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10),today=()=>new Date().toISOString().slice(0,10);
const fa=(n,x="")=>`<i class="fa-solid fa-${n} ${x}"></i>`;
const ICONS=["bolt","lightbulb","plug","screwdriver-wrench","tv","video","satellite-dish","network-wired","battery-full","toolbox","box","helmet-safety","camera","door-open","snowflake","faucet","shield-halved","location-dot","wifi","hammer","microchip","fan","lock","server"];
const isFa=s=>/^[a-z0-9-]+$/.test(s||"");
const cico=c=>`<span class="inline-block w-5 text-center">${isFa(c.icon)?fa(c.icon):c.icon?esc(c.icon):fa("box")}</span>`;
const dmy=x=>x.split("-").reverse().join("/");
const stamp=()=>{const n=new Date(),p=x=>String(x).padStart(2,"0");return`${n.getFullYear()}${p(n.getMonth()+1)}${p(n.getDate())}-${p(n.getHours())}${p(n.getMinutes())}`};
let stat={t:"กำลังโหลด…",c:""};
function setStatus(t,c){stat={t,c:c||""};const e=$("#st");if(e){e.textContent=t;e.className=c||""}}
function toast(m,c){const t=document.createElement("div");t.className="pointer-events-auto rounded-xl px-4 py-2.5 text-sm font-medium text-white shadow-xl "+(c==="er"?"bg-red-600":"bg-emerald-600");t.textContent=m;$("#toast").append(t);setTimeout(()=>t.remove(),3800)}
function ask(title,html,ok,w,extra){$("#dlg").style.width=w||"";$("#frm").innerHTML=`<h3 class="mb-1 text-lg font-bold">${title}</h3>${html}<div class="act">${extra||""}<button type="button" id="cn">ยกเลิก</button><button class="p" id="ok" type="button">ตกลง</button></div>`;
  if(!$("#dlg").open)$("#dlg").showModal();$("#cn").onclick=()=>$("#dlg").close();$("#ok").onclick=()=>{if(ok()!==false)$("#dlg").close()};$("#frm input,#frm select")?.focus()}
const pick=acc=>new Promise(r=>{const i=document.createElement("input");i.type="file";i.accept=acc;i.onchange=()=>r(i.files[0]||null);i.click()});
function dl(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
/* CSV */
function csvParse(t){t=t.replace(/^\ufeff/,"");const f1=t.split(/\r?\n/,1)[0],cnt=c=>(f1.match(new RegExp(c==="\t"?"\t":"\\"+c,"g"))||[]).length;
  const d=cnt("\t")>cnt(",")?"\t":cnt(";")>cnt(",")?";":",",rows=[];let r=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===d){r.push(f);f=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;r.push(f);f="";if(r.some(x=>x.trim()!==""))rows.push(r);r=[]}else f+=c}
  r.push(f);if(r.some(x=>x.trim()!==""))rows.push(r);return rows}
const csvOut=rows=>"\ufeff"+rows.map(r=>r.map(x=>'"'+String(x??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");
/* ================= state ================= */
let S={cats:[],log:[],users:[],seq:0},loaded=false,src=null,fh=null,lastH=null,admin=false,user=null,cart=[],ci={},tab=null,bcat=null,q="",lf={who:"",slip:"",from:"",to:""};
let ghSha=null,ghBusy=false,ghMissing=false,ghWarned=false,ghQ=Promise.resolve(),fails=0,lockUntil=0,tA,tU;
const find=id=>{for(const c of S.cats){const i=c.items.find(x=>x.id===id);if(i)return{c,i}}};
const used=id=>S.log.reduce((a,l)=>l.item===id?a+l.amt:a,0),rem=i=>i.qty-used(i.id);
const me=()=>S.users.find(u=>u.id===user&&u.active!==false);
const whoList=()=>[...new Set(S.log.map(l=>l.who).filter(Boolean))];
const R=()=>{const h=location.hash.replace(/^#\/?/,"").split("/");return h[0]==="admin"?{area:"back",page:h[1]||"dash"}:{area:"front",page:h[0]||"stock"}};
function norm(d){if(!d||!Array.isArray(d.cats))throw Error("รูปแบบไฟล์ไม่ถูกต้อง (ไม่พบข้อมูลหมวด)");d.log||=[];d.users||=[];d.trash||=[];d.seq||=0;
  d.cats.forEach(c=>{c.id||=uid();c.items||=[];c.items.forEach(i=>{i.id||=uid();i.qty=+i.qty||0;i.unit||="";i.code||=""})});d.users.forEach(u=>{u.id||=uid()});d.log.forEach(l=>{l.id||=uid();l.amt=+l.amt||0});return d}
/* ================= storage: file / local ================= */
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open("stock-app",1);r.onupgradeneeded=()=>r.result.createObjectStore("h");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const idbSet=async h=>{try{(await idb()).transaction("h","readwrite").objectStore("h").put(h,"fh")}catch(e){}};
const idbGet=async()=>{try{const d=await idb();return await new Promise(r=>{const x=d.transaction("h").objectStore("h").get("fh");x.onsuccess=()=>r(x.result);x.onerror=()=>r(null)})}catch(e){return null}};
const FP={types:[{description:"stock-data.json",accept:{"application/json":[".json"]}}]};
async function persist(){
  if(!loaded)return;try{localStorage.setItem("stock-v1",JSON.stringify(S))}catch(e){}
  if(src==="gh")return ghQueue();
  if(fh){try{const w=await fh.createWritable();await w.write(JSON.stringify(S,null,1));await w.close();setStatus("ออฟไลน์ · บันทึกลงไฟล์ "+fh.name+" แล้ว","ok")}catch(e){setStatus("บันทึกไฟล์ไม่สำเร็จ: "+e.message,"wa")}return}
  setStatus("ออฟไลน์ · เก็บในเบราว์เซอร์นี้เท่านั้น — ควรสำรองข้อมูลเป็นระยะ","wa")}
const change=()=>{persist();render()};
async function useData(txt,h,sr,keep){
  const d=norm(JSON.parse(txt)),k={tab,admin,cart,ci};S=d;fh=h||null;src=sr||(h?"file":null);loaded=true;
  user=sessionStorage.getItem("uid");if(!S.users.some(u=>u.id===user))user=null;
  tab=S.cats[0]?.id;bcat=S.cats[0]?.id;cart=[];ci={};admin=false;
  if(keep){if(S.cats.some(c=>c.id===k.tab))tab=k.tab;admin=k.admin;cart=k.cart;ci=k.ci}
  try{localStorage.setItem("stock-v1",JSON.stringify(S))}catch(e){}
  if(fh){idbSet(fh);setStatus("ออฟไลน์ · เชื่อมไฟล์ "+fh.name+" (บันทึกอัตโนมัติ)","ok")}else if(src!=="gh")setStatus("ออฟไลน์ · ยังไม่ได้เชื่อมไฟล์ — ไปที่หลังบ้าน > ข้อมูลและสำรอง","wa");
  render()}
async function openFile(){try{let f,h=null;if(window.showOpenFilePicker){[h]=await showOpenFilePicker(FP);f=await h.getFile()}else f=await pick(".json");if(f)await useData(await f.text(),h)}catch(e){if(e.name!=="AbortError")toast("เปิดไฟล์ไม่สำเร็จ: "+e.message,"er")}}
async function dbHandle(){const d=await showDirectoryPicker({mode:"readwrite"}),db=d.name==="database"?d:await d.getDirectoryHandle("database",{create:true});return db.getFileHandle("stock-data.json",{create:true})}
async function connectDir(){
  if(!window.showDirectoryPicker)return toast("เบราว์เซอร์นี้ไม่รองรับการเชื่อมโฟลเดอร์ (ใช้ Chrome / Edge) — ใช้ “เปิดไฟล์ข้อมูล” แทน","er");
  try{const h=await dbHandle(),txt=await(await h.getFile()).text();
    if(txt.trim()){await useData(txt,h);toast("เชื่อมต่อ database/stock-data.json แล้ว")}
    else{ensureLoaded();fh=h;src="file";idbSet(h);await persist();render();toast("สร้าง database/stock-data.json และบันทึกข้อมูลปัจจุบันลงไฟล์แล้ว")}}
  catch(e){if(e.name!=="AbortError")toast("เชื่อมต่อไม่สำเร็จ: "+e.message,"er")}}
async function saveAs(){if(!window.showSaveFilePicker)return dl("stock-data.json",JSON.stringify(S,null,1),"application/json");try{fh=await showSaveFilePicker({...FP,suggestedName:"stock-data.json"});idbSet(fh);src="file";await persist();render()}catch(e){}}
/* ================= storage: online (GitHub) ================= */
const DB_PATH="database/stock-data.json";
const ghCfg=()=>{let sv={};try{sv=JSON.parse(localStorage.getItem("gh-cfg")||"{}")}catch(e){}const c={owner:"",repo:"",path:DB_PATH,token:""};for(const k in sv)if(sv[k]&&!(k==="path"&&sv[k]==="stock.json"))c[k]=sv[k];return c};
const online=()=>!localStorage.getItem("gh-off")&&!!localStorage.getItem("gh-cfg")&&!!ghCfg().owner&&!!ghCfg().repo;
const b64e=t=>btoa(unescape(encodeURIComponent(t))),b64d=b=>decodeURIComponent(escape(atob(b.replace(/\s/g,""))));
const ghUrl=c=>`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${c.path.split("/").map(encodeURIComponent).join("/")}`;
const ghH=c=>({Accept:"application/vnd.github+json",...(c.token?{Authorization:"Bearer "+c.token}:{})});
async function ghGet(){const c=ghCfg(),r=await fetch(ghUrl(c)+"?t="+Date.now(),{headers:ghH(c),cache:"no-store"});
  if(r.status===404)return{sha:null,txt:null};
  if(!r.ok)throw Error("GitHub "+r.status+(r.status===401?" (token ไม่ถูกต้อง)":r.status===403?" (เกินโควตา/ไม่มีสิทธิ์)":""));
  const j=await r.json();return{sha:j.sha,txt:b64d(j.content)}}
function ghStatus(){const t=ghCfg().token;setStatus(t?"ออนไลน์ · ซิงก์ล่าสุด "+new Date().toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"}):"ออนไลน์ · อ่านอย่างเดียว (ยังไม่ได้ตั้ง token)",t?"ok":"wa")}
async function ghLoad(keep){
  const g=await ghGet(),same=g.sha===ghSha;ghSha=g.sha;ghMissing=g.txt===null;
  if(ghMissing){if(loaded&&ghCfg().token){src="gh";return ghQueue()}setStatus("ออนไลน์ · ยังไม่พบไฟล์ "+ghCfg().path+" ในรีโป","wa");render();return}
  if(keep&&same)return;
  await useData(g.txt,null,"gh",keep);ghStatus()}
function ghQueue(){ghBusy=true;setStatus("ออนไลน์ · กำลังบันทึก…");ghQ=ghQ.then(()=>ghPush(true)).catch(e=>setStatus("บันทึกออนไลน์ไม่สำเร็จ: "+e.message,"wa")).finally(()=>{ghBusy=false});return ghQ}
async function ghPush(retry){
  const c=ghCfg();if(!c.token){setStatus("ยังไม่ได้ตั้ง token — ข้อมูลไม่ถูกบันทึกออนไลน์","wa");if(!ghWarned){ghWarned=true;ghDlg()}return}
  const r=await fetch(ghUrl(c),{method:"PUT",headers:{...ghH(c),"Content-Type":"application/json"},body:JSON.stringify({message:"update stock "+new Date().toISOString(),content:b64e(JSON.stringify(S,null,1)),...(ghSha?{sha:ghSha}:{})})});
  if(r.status===409||r.status===422){if(!retry)throw Error("ข้อมูลชนกัน กดรีเฟรชแล้วลองใหม่");await ghMerge();return ghPush(false)}
  if(!r.ok)throw Error("GitHub "+r.status+(r.status===401?" (token ไม่ถูกต้อง)":r.status===403||r.status===404?" (token ไม่มีสิทธิ์เขียน repo นี้)":""));
  ghSha=(await r.json()).content.sha;ghStatus()}
async function ghMerge(){const g=await ghGet();ghSha=g.sha;if(!g.txt)return;const Rm=JSON.parse(g.txt),ids=new Set(S.log.map(l=>l.id));
  (Rm.log||[]).forEach(l=>{if(!ids.has(l.id))S.log.push(l)});S.seq=Math.max(S.seq||0,Rm.seq||0);
  if(!admin){S.cats=Rm.cats;if(Rm.admin)S.admin=Rm.admin;if(Rm.users)S.users=Rm.users}render()}
async function ghBackup(){const c=ghCfg();if(!c.token)throw Error("ต้องตั้งค่า token ก่อน");const name=`database/backups/stock-${stamp()}.json`;
  const r=await fetch(ghUrl({...c,path:name}),{method:"PUT",headers:{...ghH(c),"Content-Type":"application/json"},body:JSON.stringify({message:"backup "+name,content:b64e(JSON.stringify(S,null,1))})});
  if(!r.ok)throw Error("GitHub "+r.status);toast("สำรองไปที่ "+name+" ใน repo แล้ว")}
function ghDlg(){const c=ghCfg();

const enc=s=>new TextEncoder().encode(s),hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
async function legacyHash(p,salt){const d=enc(salt+p);if(window.crypto&&crypto.subtle)return hex(await crypto.subtle.digest("SHA-256",d));let h=5381;for(const b of d)h=(h*33^b)>>>0;return"f"+h}
async function hashPw(p,salt){if(window.crypto&&crypto.subtle){const k=await crypto.subtle.importKey("raw",enc(p),"PBKDF2",false,["deriveBits"]);return"p1$"+hex(await crypto.subtle.deriveBits({name:"PBKDF2",salt:enc(salt),iterations:100000,hash:"SHA-256"},k,256))}return legacyHash(p,salt)}
const chk=async(p,salt,hash)=>!!hash&&(hash.startsWith("p1$")?await hashPw(p,salt)===hash:await legacyHash(p,salt)===hash);

function importItemsCsv(txt,upd){
  const rows=csvParse(txt);if(rows.length<2)throw Error("ไฟล์ว่างหรือไม่มีแถวข้อมูล");
  const H=rows[0].map(h=>h.trim().toLowerCase()),col=(...n)=>H.findIndex(h=>n.includes(h));
  const X={cat:col("หมวด","หมวดหมู่","category","cat"),name:col("ชื่อรายการ","รายการ","name","item"),code:col("รหัสสินค้า","รหัส","code","sku"),unit:col("หน่วย","unit"),qty:col("จำนวน","จำนวนทั้งหมด","qty","quantity")};
  if(X.name<0)throw Error("ไม่พบคอลัมน์ “ชื่อรายการ” (หัวคอลัมน์: หมวด, ชื่อรายการ, รหัสสินค้า, หน่วย, จำนวน)");
  ensureLoaded();snapshot();let add=0,up=0,skip=0;
  rows.slice(1).forEach(r=>{const g=k=>X[k]>=0?(r[X[k]]||"").trim():"",name=g("name");if(!name)return;
    const cn=g("cat")||"ทั่วไป";let c=S.cats.find(x=>x.name===cn);if(!c){c={id:uid(),name:cn,icon:"box",items:[]};S.cats.push(c)}
    const code=g("code"),it=c.items.find(x=>x.name===name||(code&&x.code===code)),qty=parseFloat(g("qty").replace(/,/g,""));
    if(it){if(!upd){skip++;return}if(X.code>=0)it.code=code;if(X.unit>=0)it.unit=g("unit");if(!isNaN(qty))it.qty=qty;up++}
    else{c.items.push({id:uid(),name,code,unit:g("unit"),qty:isNaN(qty)?0:qty});add++}});
  return{add,up,skip}}
function mergeJson(txt,upd){
  const d=norm(JSON.parse(txt));ensureLoaded();snapshot();let add=0,up=0,skip=0;const map={};
  d.cats.forEach(dc=>{const c=S.cats.find(x=>x.id===dc.id||x.name===dc.name);if(!c){S.cats.push(dc);add+=dc.items.length;return}
    dc.items.forEach(di=>{const it=c.items.find(x=>x.id===di.id||x.name===di.name||(di.code&&x.code===di.code));
      if(!it){c.items.push(di);add++}else{map[di.id]=it.id;if(upd){Object.assign(it,{code:di.code,unit:di.unit,qty:di.qty});up++}else skip++}})});
  d.users.forEach(u=>{if(!S.users.some(x=>x.id===u.id||x.username===u.username))S.users.push(u)});
  const ids=new Set(S.log.map(l=>l.id));d.log.forEach(l=>{if(!ids.has(l.id)){l.item=map[l.item]||l.item;S.log.push(l)}});S.seq=Math.max(S.seq||0,d.seq||0);
  if(!S.admin&&d.admin)S.admin=d.admin;return{add,up,skip}}

    if(!window.showSaveFilePicker){dl("stock-data.json",JSON.stringify(S,null,1),"application/json");src=null;render();toast("ดาวน์โหลดไฟล์ข้อมูลใหม่แล้ว — นำไปไว้ที่ database/stock-data.json แล้วใช้ “เปิดไฟล์ข้อมูล”");return}
    fh=await showSaveFilePicker({...FP,suggestedName:"stock-data.json"});idbSet(fh);src="file";await persist();render();toast("สร้างไฟล์ข้อมูลใหม่แล้ว")}
  catch(e){({S,loaded,src,fh}=prev);render();if(e.name!=="AbortError")toast("สร้างไฟล์ไม่สำเร็จ: "+e.message,"er")}}
/* ================= actions ================= */
const ADM=new Set(["addcat","rencat","delcat","additem","edititem","delitem","adduser","edituser","deluser","dellog","bk-json","bk-gh","ex-items","ex-log","tpl","acct","undo","f-save","f-new","im-restore","im-any","tr-restore","tr-del","tr-empty","rp-print","rp-csv"]);
const BOOT=new Set(["f-new","im-restore","im-any"]);
const A={
  cat:id=>{tab=id;q="";render()},bcat:id=>{bcat=id;bq="";render()},flt:id=>{flt=id;render()},"reset-f":()=>{q="";flt="all";tab="all";render()},
  login:()=>loginDlg(),logout:()=>{if(cart.length&&!confirm("ใบเบิกที่ยังไม่ยืนยันจะถูกล้าง ออกจากระบบหรือไม่?"))return;logout()},
  inc:id=>{const e=$("#qty-"+id);if(e){e.value=(+e.value||0)+1;qtys[id]=+e.value}},dec:id=>{const e=$("#qty-"+id);if(e){e.value=Math.max(1,(+e.value||1)-1);qtys[id]=+e.value}},
  add:id=>{if(!me())return loginDlg();const f=find(id),r=rem(f.i),n=+($("#qty-"+id)?.value)||0;if(!(n>0))return toast("กรุณาระบุจำนวน","er");
    const ex=cart.find(x=>x.item===id),tot=(ex?ex.amt:0)+n;if(tot>r)return toast(`เบิกได้สูงสุด ${r} ${f.i.unit} (อยู่ในใบเบิกแล้ว ${ex?ex.amt:0})`,"er");
    if(ex)ex.amt=tot;else cart.push({item:id,amt:n});qtys[id]=1;toast(`เพิ่ม “${f.i.name}” × ${n} ลงใบเบิกแล้ว`);cartBar();render()},
  rm:id=>{cart.splice(+id,1);refreshCart()},"cart-clear":()=>{if(confirm("ล้างรายการทั้งหมดในใบเบิก?")){cart=[];if($("#dlg").open)$("#dlg").close();cartBar();render()}},
  cart:()=>me()?openCart():loginDlg(),commit:()=>commit(false),"commit-pr":()=>commit(true),
  print:()=>{if(!logF().length)return toast("ไม่มีรายการเบิกให้พิมพ์","er");
    ask("พิมพ์ใบเบิก / บันทึก PDF",`<label>ชื่อผู้เบิก (แสดงบนใบเบิกและช่องลงชื่อ)</label><input id="f1" list="whos" value="${esc(lf.who)}"><datalist id="whos">${whoList().map(w=>`<option value="${esc(w)}">`).join("")}</datalist><label>โครงการ / สถานที่ (ถ้ามี)</label><input id="f2" value="${esc(localStorage.getItem("lastsite")||"")}"><div class="hint">พิมพ์ตามรายการที่กรองอยู่ · ต้องการไฟล์ PDF ให้เลือกปลายทางเป็น “บันทึกเป็น PDF” ในหน้าต่างพิมพ์</div>`,()=>{if(!v("f1").trim()){toast("กรุณาระบุชื่อผู้เบิก","er");return false}localStorage.setItem("lastsite",v("f2").trim());const w=v("f1").trim(),st=v("f2").trim();setTimeout(()=>printSheet(w,st,null,lf.slip),50)})},
  "adm-go":async()=>{if(locked())return;const p=$("#ap1").value,un=($("#au")?.value||"").trim().toLowerCase();
    if(!S.admin){if(!un)return toast("กรุณากรอก Username","er");if(p.length<4)return toast("รหัสผ่านอย่างน้อย 4 ตัว","er");if(p!==$("#ap2").value)return toast("รหัสยืนยันไม่ตรงกัน","er");
      const us=uid()+uid(),ps=uid()+uid();S.admin={usalt:us,uhash:await hashPw(un,us),salt:ps,hash:await hashPw(p,ps)};persist()}
    else{if(S.admin.uhash&&!await chk(un,S.admin.usalt,S.admin.uhash))return failed();if(!await chk(p,S.admin.salt,S.admin.hash))return failed()}
    fails=0;admin=true;bumpA();render()},
  "adm-out":()=>{admin=false;location.hash="#/";render()},
  acct:()=>ask("เปลี่ยน Username / Password",`<label>รหัสผ่านปัจจุบัน</label><input id="f0" type="password"><label>Username ใหม่ (เว้นว่าง = ไม่เปลี่ยน)</label><input id="f1" autocomplete="off"><label>Password ใหม่ (เว้นว่าง = ไม่เปลี่ยน)</label><input id="f2" type="password"><label>ยืนยัน Password ใหม่</label><input id="f3" type="password"><div class="hint">Username และ Password ถูกเข้ารหัสก่อนเก็บ (PBKDF2 / SHA-256) ดูย้อนหลังไม่ได้</div>`,()=>{(async()=>{
    if(!await chk(v("f0"),S.admin.salt,S.admin.hash))return toast("รหัสผ่านปัจจุบันไม่ถูกต้อง","er");const un=v("f1").trim().toLowerCase(),pw=v("f2");
    if(!un&&!pw)return toast("ยังไม่ได้กรอกค่าใหม่","er");if(pw&&pw.length<4)return toast("รหัสผ่านอย่างน้อย 4 ตัว","er");if(pw&&pw!==v("f3"))return toast("รหัสยืนยันไม่ตรงกัน","er");
    if(un){S.admin.usalt=uid()+uid();S.admin.uhash=await hashPw(un,S.admin.usalt)}if(pw){S.admin.salt=uid()+uid();S.admin.hash=await hashPw(pw,S.admin.salt)}
    $("#dlg").close();change();toast("บันทึกบัญชีผู้ดูแลแล้ว")})();return false}),
  addcat:()=>catDlg(),rencat:()=>catDlg(S.cats.find(c=>c.id===bcat)),
  delcat:()=>{const c=S.cats.find(x=>x.id===bcat);if(c&&confirm(`ลบหมวด “${c.name}” พร้อมรายการทั้งหมด?\n(ย้ายไปถังขยะ กู้คืนได้)`)){const ids=c.items.map(i=>i.id);toTrash("cat",c,{logs:S.log.filter(l=>ids.includes(l.item))});S.log=S.log.filter(l=>!ids.includes(l.item));S.cats=S.cats.filter(x=>x!==c);bcat=S.cats[0]?.id;change();toast("ย้ายหมวดไปถังขยะแล้ว")}},
  additem:()=>itemDlg(S.cats.find(c=>c.id===bcat)),edititem:id=>{const f=find(id);itemDlg(f.c,f.i)},
  delitem:id=>{const{c,i}=find(id);if(confirm(`ลบ “${i.name}” ?\n(ย้ายไปถังขยะ กู้คืนได้)`)){toTrash("item",i,{catId:c.id,catName:c.name,logs:S.log.filter(l=>l.item===id)});c.items=c.items.filter(x=>x!==i);S.log=S.log.filter(l=>l.item!==id);change();toast("ย้ายรายการไปถังขยะแล้ว")}},
  adduser:()=>userDlg(),edituser:id=>userDlg(S.users.find(x=>x.id===id)),
  deluser:id=>{const u=S.users.find(x=>x.id===id);if(confirm(`ลบผู้เบิก “${u.name}”? (ประวัติการเบิกเดิมยังอยู่)`)){toTrash("user",u);S.users=S.users.filter(x=>x!==u);if(user===u.id)user=null;change()}},
  dellog:id=>{const l=S.log.find(x=>x.id===id);if(l&&confirm("ยกเลิกรายการเบิกนี้? ของจะถูกคืนเข้าคงเหลือ")){toTrash("log",l);S.log=S.log.filter(x=>x!==l);change()}},
  "tr-restore":id=>{const t=S.trash.find(x=>x.id===id);if(!t)return;
    if(t.kind==="cat"){if(S.cats.some(c=>c.id===t.data.id||c.name===t.data.name))return toast("มีหมวดชื่อ/รหัสเดียวกันอยู่แล้ว","er");S.cats.push(t.data);S.log.push(...(t.logs||[]))}
    else if(t.kind==="item"){let c=S.cats.find(x=>x.id===t.catId)||S.cats.find(x=>x.name===t.catName);if(!c){c={id:t.catId||uid(),name:t.catName||"กู้คืน",icon:"box",items:[]};S.cats.push(c)}c.items.push(t.data);S.log.push(...(t.logs||[]))}
    else if(t.kind==="log"){if(!find(t.data.item))return toast("ไม่พบรายการสินค้าของใบเบิกนี้ — กู้คืนรายการสินค้าก่อน","er");S.log.push(t.data)}
    else if(t.kind==="user"){if(S.users.some(u=>u.username===t.data.username))return toast("ชื่อผู้ใช้นี้ถูกใช้แล้ว","er");S.users.push(t.data)}
    S.trash=S.trash.filter(x=>x!==t);change();toast("กู้คืนเรียบร้อย")},
  "tr-del":id=>{if(confirm("ลบถาวร? กู้คืนไม่ได้อีก")){S.trash=S.trash.filter(x=>x.id!==id);change()}},
  "tr-empty":()=>{if(confirm(`ล้างถังขยะ ${S.trash.length} รายการ? กู้คืนไม่ได้อีก`)){S.trash=[];change()}},
  "rp-print":printReport,
  "rp-csv":()=>{const D=reportData(),r=[["หมวด","รายการ","หน่วย","จำนวนที่เบิก","จำนวนครั้ง"]];D.items.forEach(i=>r.push([i.cat,i.name,i.unit,i.amt,i.n]));dl(`report-${rpm}.csv`,csvOut(r),"text/csv")},
  "f-open":openFile,"f-dir":connectDir,"f-save":saveAs,"f-new":newFile,"gh-set":ghDlg,
  "gh-off":()=>{localStorage.removeItem("gh-cfg");localStorage.setItem("gh-off","1");ghSha=null;if(src==="gh"){src=null;fh=null}if($("#dlg").open)$("#dlg").close();setStatus("ออฟไลน์ · ยกเลิกการเชื่อมต่อออนไลน์แล้ว (ข้อมูลในหน้านี้ยังอยู่)","wa");render();toast("ยกเลิกการเชื่อมต่อ GitHub แล้ว")},
  "gh-rf":()=>online()?ghLoad(true).then(()=>toast("ซิงก์ข้อมูลแล้ว")).catch(e=>toast(e.message,"er")):toast("ยังไม่ได้เชื่อมต่อออนไลน์ — เลือก “ตั้งค่า / เชื่อมต่อ GitHub”","er"),
  "bk-gh":()=>ghBackup().catch(e=>toast("สำรองไม่สำเร็จ: "+e.message,"er")),
  "bk-json":()=>{dl(`stock-backup-${stamp()}.json`,JSON.stringify(S,null,1),"application/json");toast("ดาวน์โหลดไฟล์สำรองแล้ว")},
  "ex-items":()=>{const r=[["หมวด","ชื่อรายการ","รหัสสินค้า","หน่วย","จำนวน","เบิกใช้แล้ว","คงเหลือ"]];S.cats.forEach(c=>c.items.forEach(i=>r.push([c.name,i.name,i.code,i.unit,i.qty,used(i.id),rem(i)])));dl(`stock-items-${stamp()}.csv`,csvOut(r),"text/csv")},
  "ex-log":()=>{const r=[["เลขที่ใบเบิก","วันที่","หมวด","ชื่อรายการ","รหัสสินค้า","จำนวนเบิก","หน่วย","ผู้เบิก","โครงการ/สถานที่","หมายเหตุ"]];[...S.log].sort((a,b)=>a.date.localeCompare(b.date)).forEach(l=>{const f=find(l.item);r.push([l.slip||"",l.date,f?.c.name||"",f?.i.name||"(ลบแล้ว)",f?.i.code||"",l.amt,f?.i.unit||"",l.who||"",l.site||"",l.note||""])});dl(`stock-log-${stamp()}.csv`,csvOut(r),"text/csv")},
  tpl:()=>dl("แม่แบบนำเข้ารายการ.csv",csvOut([["หมวด","ชื่อรายการ","รหัสสินค้า","หน่วย","จำนวน"]]),"text/csv"),
  "im-restore":async()=>{const f=await pick(".json,application/json");if(!f)return;
    try{const txt=await f.text(),d=norm(JSON.parse(txt));
      if(loaded){if(!confirm(`กู้คืนจากไฟล์ ${f.name}\n${d.cats.length} หมวด · ${d.cats.reduce((a,c)=>a+c.items.length,0)} รายการ · ${d.log.length} ประวัติ\n\nข้อมูลปัจจุบันจะถูกแทนที่ (ระบบสำรองข้อมูลเดิมไว้ให้ย้อนกลับได้ 1 ครั้ง) ต้องการดำเนินการต่อ?`))return;
        snapshot();if(!d.admin&&S.admin)d.admin=S.admin;S=d;tab="all";bcat=S.cats[0]?.id;cart=[];if(!S.users.some(u=>u.id===user))user=null;change()}
      else{await useData(txt,null,ghMissing?"gh":null);persist()}toast("กู้คืนข้อมูลเรียบร้อย")}catch(e){toast("กู้คืนไม่สำเร็จ: "+e.message,"er")}},
  "im-any":async()=>{const f=await pick(".json,.csv,application/json,text/csv");if(!f)return;const txt=await f.text(),csv=/\.csv$/i.test(f.name)||!txt.trim().startsWith("{");
    ask("นำเข้าข้อมูลจาก "+esc(f.name),`<label>เมื่อพบรายการซ้ำ</label><select id="f1"><option value="skip">ข้าม (ไม่แก้ข้อมูลเดิม)</option><option value="upd">อัปเดตด้วยข้อมูลจากไฟล์</option></select><div class="hint">นำเข้าแบบเพิ่มเข้าไป ไม่ลบข้อมูลเดิม · ระบบสำรองข้อมูลเดิมไว้ให้ย้อนกลับได้</div>`,
    ()=>{try{const r=(csv?importItemsCsv:mergeJson)(txt,v("f1")==="upd");tab=tab||"all";bcat=bcat||S.cats[0]?.id;change();toast(`นำเข้าแล้ว: เพิ่มใหม่ ${r.add} · อัปเดต ${r.up} · ข้าม ${r.skip} รายการ`)}catch(e){toast("นำเข้าไม่สำเร็จ: "+e.message,"er");return false}})},
  undo:()=>{const t=localStorage.getItem("stock-undo");if(!t)return;if(!confirm("ย้อนกลับไปก่อนการนำเข้า/กู้คืนครั้งล่าสุด?"))return;S=norm(JSON.parse(t));localStorage.removeItem("stock-undo");tab="all";bcat=S.cats[0]?.id;change();toast("ย้อนกลับแล้ว")},
  reconnect:async()=>{try{if(await lastH.requestPermission({mode:"readwrite"})!=="granted")return;await useData(await(await lastH.getFile()).text(),lastH)}catch(e){toast("เชื่อมต่อไม่สำเร็จ: "+e.message,"er")}},
  usebackup:()=>useData(localStorage.getItem("stock-v1"),null,ghMissing?"gh":null).catch(e=>toast(e.message,"er")),

};
/* ================= events ================= */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-m]");document.querySelectorAll(".menu").forEach(m=>{if(!t||m.id!=="m-"+t.dataset.m)m.classList.remove("open")});if(t)$("#m-"+t.dataset.m).classList.toggle("open");
  bumpU();if(admin)bumpA();
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;const a=b.dataset.act;
  if(ADM.has(a)&&!admin&&!(BOOT.has(a)&&!loaded))return toast("ฟังก์ชันนี้ใช้ได้เฉพาะผู้ดูแลระบบ — กรุณาเข้าสู่ระบบหลังบ้านก่อน","er");
  A[a]?.(b.dataset.id)});
document.addEventListener("input",e=>{const t=e.target;
  if(t.id==="q"||t.id==="bq"){const p=t.selectionStart,id=t.id;if(id==="q")q=t.value;else bq=t.value;render();const n=$("#"+id);n.focus();n.setSelectionRange(p,p);return}
  if(t.dataset.q)qtys[t.dataset.q]=+t.value||1;if(t.dataset.f)ci[t.dataset.f]=t.value;if(t.dataset.ci!=null&&cart[+t.dataset.ci])cart[+t.dataset.ci].amt=+t.value||0;
  if(t.id==="f2"&&$("#icp"))$("#icp").innerHTML=isFa(t.value.trim())?fa(t.value.trim()):esc(t.value)});
document.addEventListener("change",e=>{const id=e.target.id||"";if(id.startsWith("lf-")){lf[id.slice(3)]=e.target.value;render()}if(id==="rp-m"&&e.target.value){rpm=e.target.value;render()}});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&["ap1","ap2","au"].includes(e.target.id))A["adm-go"]();
  if(e.key==="/"&&!["INPUT","TEXTAREA","SELECT"].includes(e.target.tagName)&&$("#q")){e.preventDefault();$("#q").focus()}});
$("#frm").onkeydown=e=>{if(e.key==="Enter"&&e.target.tagName==="INPUT"&&$("#ok")){e.preventDefault();$("#ok").click()}};
$("#frm").onclick=e=>{const ic=e.target.closest("[data-ic]");if(ic){$("#f2").value=ic.dataset.ic;$("#icp").innerHTML=fa(ic.dataset.ic);document.querySelectorAll("[data-ic]").forEach(b=>b.classList.toggle("ring-2",b===ic))}};
window.addEventListener("hashchange",render);window.addEventListener("resize",cartBar);
setInterval(ghTick,60000);document.addEventListener("visibilitychange",ghTick);
window.onbeforeunload=e=>{if(loaded&&!src&&!fh){e.preventDefault();e.returnValue=""}};
async function init(){
  if(online()){try{await ghLoad(false)}catch(e){setStatus("โหลดออนไลน์ไม่สำเร็จ: "+e.message,"wa")}if(loaded)return}
  try{const r=await fetch(DB_PATH,{cache:"no-store"});if(r.ok){await useData(await r.text(),null);setStatus("ออฟไลน์ · โหลดจาก database/stock-data.json (ยังไม่เชื่อมโฟลเดอร์สำหรับบันทึก)","wa");return}}catch(e){}
  setStatus("ยังไม่ได้โหลดข้อมูล","wa");lastH=await idbGet();render()}
render();init();
</script></body></html>
