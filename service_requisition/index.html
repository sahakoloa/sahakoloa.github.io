<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script>tailwind.config={theme:{extend:{fontFamily:{sans:['"Noto Sans Thai"','system-ui','sans-serif']}}}}</script>
<style type="text/tailwindcss">
@layer base{
 body{@apply bg-slate-100 font-sans text-slate-800 antialiased dark:bg-slate-900 dark:text-slate-100;background-image:radial-gradient(60rem 28rem at 10% -10%,rgba(99,102,241,.14),transparent);background-attachment:fixed}
 label{@apply mb-1 mt-3 block text-xs font-medium text-slate-500 dark:text-slate-400}
 input,select,textarea{@apply w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:border-slate-600 dark:bg-slate-800}
 table{@apply w-full text-sm}
 th{@apply whitespace-nowrap bg-slate-50 px-4 py-3 text-left text-xs font-semibold tracking-wide text-slate-500 dark:bg-slate-900/40 dark:text-slate-400}
 td{@apply border-t border-slate-100 px-4 py-3 dark:border-slate-700}
 tr:hover>td{@apply bg-slate-50/70 dark:bg-slate-700/30}
 dialog{@apply rounded-2xl bg-white p-6 text-slate-800 shadow-2xl dark:bg-slate-800 dark:text-slate-100;width:min(460px,92vw)}
 dialog::backdrop{background:rgba(15,23,42,.55)}
}
@layer components{
 button{@apply inline-flex cursor-pointer items-center justify-center gap-1.5 rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-sm font-medium text-slate-700 shadow-sm transition hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-40 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700}
 button.p{@apply border-indigo-600 bg-indigo-600 text-white hover:bg-indigo-500 dark:bg-indigo-600 dark:hover:bg-indigo-500}
 button.d{@apply text-red-600 hover:bg-red-50 dark:text-red-400 dark:hover:bg-red-950}
 button.s{@apply px-2.5 py-1 text-xs}
 #st{@apply inline-block rounded-full bg-slate-100 px-2.5 py-0.5 text-[11px] text-slate-500 dark:bg-slate-800 dark:text-slate-400}
 #st.ok{@apply bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300}
 #st.wa{@apply bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300}
 .pills{@apply mb-5 flex flex-wrap gap-2}.pills button{@apply rounded-full px-4 py-2}
 .pills button.on{@apply border-indigo-600 bg-indigo-600 text-white shadow-md shadow-indigo-500/30}
 .bar{@apply mb-4 flex flex-wrap items-center gap-2}.bar input{@apply max-w-xs}
 .card{@apply overflow-auto rounded-2xl border border-slate-200 bg-white shadow-sm dark:border-slate-700 dark:bg-slate-800}
 td.n,th.n{@apply text-right}td.ac{@apply whitespace-nowrap text-right}
 .b{@apply inline-block min-w-[2.5rem] rounded-full px-2.5 py-0.5 text-center text-xs font-semibold}
 .b.ok{@apply bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300}
 .b.wa{@apply bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300}
 .b.er{@apply bg-red-100 text-red-700 dark:bg-red-900/40 dark:text-red-300}
 .sum{@apply mt-3 text-xs text-slate-500 dark:text-slate-400}.empty{@apply py-12 text-center text-slate-400}
 .row{@apply flex gap-3}.row>*{@apply flex-1}.act{@apply mt-6 flex justify-end gap-2}.hint{@apply mt-1 text-xs text-slate-400}
 .lf{@apply mb-4 flex flex-wrap items-end gap-3}.lf>div{@apply min-w-[9rem]}.lf label{@apply mt-0}
 .nav{@apply inline-flex cursor-pointer items-center gap-2 rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800}
 .nav.on{@apply bg-indigo-50 text-indigo-700 dark:bg-indigo-900/40 dark:text-indigo-200}
 .menu{@apply absolute left-0 z-40 mt-2 hidden w-64 rounded-2xl border border-slate-200 bg-white p-1.5 shadow-xl dark:border-slate-700 dark:bg-slate-800}
 .menu.right{@apply left-auto right-0}.menu.open{@apply block}
 .mi{@apply flex w-full cursor-pointer items-center justify-start gap-2 rounded-lg border-0 bg-transparent px-3 py-2 text-left text-sm shadow-none hover:bg-slate-100 dark:bg-transparent dark:hover:bg-slate-700}
 .sb{@apply flex shrink-0 cursor-pointer items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-300 hover:bg-white/10}
 .sb.on{@apply bg-white/15 text-white}
 .kpi{@apply flex items-center gap-4 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md dark:border-slate-700 dark:bg-slate-800}
 #cartbar{@apply fixed bottom-5 left-1/2 z-20 -translate-x-1/2 items-center gap-4 whitespace-nowrap rounded-full bg-indigo-600 py-2 pl-5 pr-2 text-sm text-white shadow-xl shadow-indigo-500/40;display:none}
 #cartbar button{@apply rounded-full border-0 bg-white px-4 py-1.5 text-indigo-700 hover:bg-indigo-50}
}
#pr{display:none}
@media print{body{background:#fff;color:#000}#app,dialog,#cartbar,#toast{display:none!important}#pr{display:block;font-size:13px}
#pr h2{font-size:20px;font-weight:700;text-align:center;margin:0 0 4px}#pr .m{display:flex;justify-content:space-between;margin:10px 0}
#pr table{border:1px solid #000}#pr th,#pr td{border:1px solid #000;padding:5px 7px;color:#000;background:#fff;font-size:13px}
#pr .sg{display:flex;justify-content:space-around;margin-top:60px;text-align:center}#pr .sg div{width:30%}#pr .sg i{display:block;border-top:1px dotted #000;margin-top:40px;padding-top:4px;font-style:normal}}
</style></head><body>
<div id="app"></div><div id="pr"></div><div id="cartbar"></div><div id="toast" class="pointer-events-none fixed right-4 top-4 z-50 flex flex-col gap-2"></div>
<dialog id="dlg"><form method="dialog" id="frm"></form></dialog>
<script>
/* ================= helpers ================= */
const $=s=>document.querySelector(s),v=id=>$("#"+id).value;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10),today=()=>new Date().toISOString().slice(0,10);
const fa=(n,x="")=>`<i class="fa-solid fa-${n} ${x}"></i>`;
const ICONS=["bolt","lightbulb","plug","screwdriver-wrench","tv","video","satellite-dish","network-wired","battery-full","toolbox","box","helmet-safety","camera","door-open","snowflake","faucet","shield-halved","location-dot","wifi","hammer","microchip","fan","lock","server"];
const isFa=s=>/^[a-z0-9-]+$/.test(s||"");
const cico=c=>`<span class="inline-block w-5 text-center">${isFa(c.icon)?fa(c.icon):c.icon?esc(c.icon):fa("box")}</span>`;
const dmy=x=>x.split("-").reverse().join("/");
const stamp=()=>{const n=new Date(),p=x=>String(x).padStart(2,"0");return`${n.getFullYear()}${p(n.getMonth()+1)}${p(n.getDate())}-${p(n.getHours())}${p(n.getMinutes())}`};
let stat={t:"กำลังโหลด…",c:""};
function setStatus(t,c){stat={t,c:c||""};const e=$("#st");if(e){e.textContent=t;e.className=c||""}}
function toast(m,c){const t=document.createElement("div");t.className="pointer-events-auto rounded-xl px-4 py-2.5 text-sm font-medium text-white shadow-xl "+(c==="er"?"bg-red-600":"bg-emerald-600");t.textContent=m;$("#toast").append(t);setTimeout(()=>t.remove(),3800)}
function ask(title,html,ok,w){$("#dlg").style.width=w||"";$("#frm").innerHTML=`<h3 class="mb-1 text-lg font-bold">${title}</h3>${html}<div class="act"><button type="button" id="cn">ยกเลิก</button><button class="p" id="ok" type="button">ตกลง</button></div>`;
  if(!$("#dlg").open)$("#dlg").showModal();$("#cn").onclick=()=>$("#dlg").close();$("#ok").onclick=()=>{if(ok()!==false)$("#dlg").close()};$("#frm input,#frm select")?.focus()}
const pick=acc=>new Promise(r=>{const i=document.createElement("input");i.type="file";i.accept=acc;i.onchange=()=>r(i.files[0]||null);i.click()});
function dl(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
/* CSV */
function csvParse(t){t=t.replace(/^\ufeff/,"");const f1=t.split(/\r?\n/,1)[0],cnt=c=>(f1.match(new RegExp(c==="\t"?"\t":"\\"+c,"g"))||[]).length;
  const d=cnt("\t")>cnt(",")?"\t":cnt(";")>cnt(",")?";":",",rows=[];let r=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===d){r.push(f);f=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;r.push(f);f="";if(r.some(x=>x.trim()!==""))rows.push(r);r=[]}else f+=c}
  r.push(f);if(r.some(x=>x.trim()!==""))rows.push(r);return rows}
const csvOut=rows=>"\ufeff"+rows.map(r=>r.map(x=>'"'+String(x??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");
/* ================= state ================= */
let S={cats:[],log:[],users:[],seq:0},loaded=false,src=null,fh=null,lastH=null,admin=false,user=null,cart=[],ci={},tab=null,bcat=null,q="",lf={who:"",slip:"",from:"",to:""};
let ghSha=null,ghBusy=false,ghMissing=false,ghWarned=false,ghQ=Promise.resolve(),fails=0,lockUntil=0,tA,tU;
const find=id=>{for(const c of S.cats){const i=c.items.find(x=>x.id===id);if(i)return{c,i}}};
const used=id=>S.log.reduce((a,l)=>l.item===id?a+l.amt:a,0),rem=i=>i.qty-used(i.id);
const me=()=>S.users.find(u=>u.id===user&&u.active!==false);
const whoList=()=>[...new Set(S.log.map(l=>l.who).filter(Boolean))];
const R=()=>{const h=location.hash.replace(/^#\/?/,"").split("/");return h[0]==="admin"?{area:"back",page:h[1]||"dash"}:{area:"front",page:h[0]||"stock"}};
function norm(d){if(!d||!Array.isArray(d.cats))throw Error("รูปแบบไฟล์ไม่ถูกต้อง (ไม่พบข้อมูลหมวด)");d.log||=[];d.users||=[];d.seq||=0;
  d.cats.forEach(c=>{c.id||=uid();c.items||=[];c.items.forEach(i=>{i.id||=uid();i.qty=+i.qty||0;i.unit||="";i.code||=""})});d.users.forEach(u=>{u.id||=uid()});d.log.forEach(l=>{l.id||=uid();l.amt=+l.amt||0});return d}
/* ================= storage: file / local ================= */
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open("stock-app",1);r.onupgradeneeded=()=>r.result.createObjectStore("h");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const idbSet=async h=>{try{(await idb()).transaction("h","readwrite").objectStore("h").put(h,"fh")}catch(e){}};
const idbGet=async()=>{try{const d=await idb();return await new Promise(r=>{const x=d.transaction("h").objectStore("h").get("fh");x.onsuccess=()=>r(x.result);x.onerror=()=>r(null)})}catch(e){return null}};
const FP={types:[{description:"ข้อมูลเบิกของ (JSON)",accept:{"application/json":[".json"]}}]};
async function persist(){
  if(!loaded)return;try{localStorage.setItem("stock-v1",JSON.stringify(S))}catch(e){}
  if(src==="gh")return ghQueue();
  if(fh){try{const w=await fh.createWritable();await w.write(JSON.stringify(S,null,1));await w.close();setStatus("ออฟไลน์ · บันทึกลงไฟล์ "+fh.name+" แล้ว","ok")}catch(e){setStatus("บันทึกไฟล์ไม่สำเร็จ: "+e.message,"wa")}return}
  setStatus("ออฟไลน์ · เก็บในเบราว์เซอร์นี้เท่านั้น — ควรสำรองข้อมูลเป็นระยะ","wa")}
const change=()=>{persist();render()};
async function useData(txt,h,sr,keep){
  const d=norm(JSON.parse(txt)),k={tab,admin,cart,ci};S=d;fh=h||null;src=sr||(h?"file":null);loaded=true;
  user=sessionStorage.getItem("uid");if(!S.users.some(u=>u.id===user))user=null;
  tab=S.cats[0]?.id;bcat=S.cats[0]?.id;cart=[];ci={};admin=false;
  if(keep){if(S.cats.some(c=>c.id===k.tab))tab=k.tab;admin=k.admin;cart=k.cart;ci=k.ci}
  try{localStorage.setItem("stock-v1",JSON.stringify(S))}catch(e){}
  if(fh){idbSet(fh);setStatus("ออฟไลน์ · เชื่อมไฟล์ "+fh.name+" (บันทึกอัตโนมัติ)","ok")}else if(src!=="gh")setStatus("ออฟไลน์ · ยังไม่ได้เชื่อมไฟล์ — ไปที่หลังบ้าน > ข้อมูลและสำรอง","wa");
  render()}
async function openFile(){try{let f,h=null;if(window.showOpenFilePicker){[h]=await showOpenFilePicker(FP);f=await h.getFile()}else f=await pick(".json");if(f)await useData(await f.text(),h)}catch(e){if(e.name!=="AbortError")toast("เปิดไฟล์ไม่สำเร็จ: "+e.message,"er")}}
async function saveAs(){if(!window.showSaveFilePicker)return dl("stock.json",JSON.stringify(S,null,1),"application/json");try{fh=await showSaveFilePicker({...FP,suggestedName:"stock.json"});idbSet(fh);src="file";await persist();render()}catch(e){}}
/* ================= storage: online (GitHub) ================= */
const GH0={owner:"sahakoloa",repo:"sahakoloa.github.io",path:"stock.json",token:""};
const ghCfg=()=>{try{return{...GH0,...JSON.parse(localStorage.getItem("gh-cfg")||"{}")}}catch(e){return{...GH0}}};
const online=()=>location.hostname.endsWith("github.io")||!!localStorage.getItem("gh-cfg");
const b64e=t=>btoa(unescape(encodeURIComponent(t))),b64d=b=>decodeURIComponent(escape(atob(b.replace(/\s/g,""))));
const ghUrl=c=>`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${c.path.split("/").map(encodeURIComponent).join("/")}`;
const ghH=c=>({Accept:"application/vnd.github+json",...(c.token?{Authorization:"Bearer "+c.token}:{})});
async function ghGet(){const c=ghCfg(),r=await fetch(ghUrl(c)+"?t="+Date.now(),{headers:ghH(c),cache:"no-store"});
  if(r.status===404)return{sha:null,txt:null};
  if(!r.ok)throw Error("GitHub "+r.status+(r.status===401?" (token ไม่ถูกต้อง)":r.status===403?" (เกินโควตา/ไม่มีสิทธิ์)":""));
  const j=await r.json();return{sha:j.sha,txt:b64d(j.content)}}
function ghStatus(){const t=ghCfg().token;setStatus(t?"ออนไลน์ · ซิงก์ล่าสุด "+new Date().toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"}):"ออนไลน์ · อ่านอย่างเดียว (ยังไม่ได้ตั้ง token)",t?"ok":"wa")}
async function ghLoad(keep){
  const g=await ghGet(),same=g.sha===ghSha;ghSha=g.sha;ghMissing=g.txt===null;
  if(ghMissing){if(loaded&&ghCfg().token){src="gh";return ghQueue()}setStatus("ออนไลน์ · ยังไม่พบไฟล์ "+ghCfg().path+" ในรีโป","wa");render();return}
  if(keep&&same)return;
  await useData(g.txt,null,"gh",keep);ghStatus()}
function ghQueue(){ghBusy=true;setStatus("ออนไลน์ · กำลังบันทึก…");ghQ=ghQ.then(()=>ghPush(true)).catch(e=>setStatus("บันทึกออนไลน์ไม่สำเร็จ: "+e.message,"wa")).finally(()=>{ghBusy=false});return ghQ}
async function ghPush(retry){
  const c=ghCfg();if(!c.token){setStatus("ยังไม่ได้ตั้ง token — ข้อมูลไม่ถูกบันทึกออนไลน์","wa");if(!ghWarned){ghWarned=true;ghDlg()}return}
  const r=await fetch(ghUrl(c),{method:"PUT",headers:{...ghH(c),"Content-Type":"application/json"},body:JSON.stringify({message:"update stock "+new Date().toISOString(),content:b64e(JSON.stringify(S,null,1)),...(ghSha?{sha:ghSha}:{})})});
  if(r.status===409||r.status===422){if(!retry)throw Error("ข้อมูลชนกัน กดรีเฟรชแล้วลองใหม่");await ghMerge();return ghPush(false)}
  if(!r.ok)throw Error("GitHub "+r.status+(r.status===401?" (token ไม่ถูกต้อง)":r.status===403||r.status===404?" (token ไม่มีสิทธิ์เขียน repo นี้)":""));
  ghSha=(await r.json()).content.sha;ghStatus()}
async function ghMerge(){const g=await ghGet();ghSha=g.sha;if(!g.txt)return;const Rm=JSON.parse(g.txt),ids=new Set(S.log.map(l=>l.id));
  (Rm.log||[]).forEach(l=>{if(!ids.has(l.id))S.log.push(l)});S.seq=Math.max(S.seq||0,Rm.seq||0);
  if(!admin){S.cats=Rm.cats;if(Rm.admin)S.admin=Rm.admin;if(Rm.users)S.users=Rm.users}render()}
async function ghBackup(){const c=ghCfg();if(!c.token)throw Error("ต้องตั้งค่า token ก่อน");const name=`backups/stock-${stamp()}.json`;
  const r=await fetch(ghUrl({...c,path:name}),{method:"PUT",headers:{...ghH(c),"Content-Type":"application/json"},body:JSON.stringify({message:"backup "+name,content:b64e(JSON.stringify(S,null,1))})});
  if(!r.ok)throw Error("GitHub "+r.status);toast("สำรองไปที่ "+name+" ใน repo แล้ว")}
function ghDlg(){const c=ghCfg();
  ask("ตั้งค่าออนไลน์ (GitHub)",`<label>เจ้าของ (owner)</label><input id="g1" value="${esc(c.owner)}"><label>ชื่อ repository</label><input id="g2" value="${esc(c.repo)}"><label>ไฟล์ข้อมูล</label><input id="g3" value="${esc(c.path)}"><label>Personal Access Token (เก็บในเครื่องนี้เท่านั้น)</label><input id="g4" type="password" value="${esc(c.token)}" placeholder="github_pat_…"><div class="hint">ใช้ Fine-grained token สิทธิ์ Contents: Read and write เฉพาะ repo นี้ · ไม่ใส่ token = อ่านอย่างเดียว</div>`,
  ()=>{localStorage.setItem("gh-cfg",JSON.stringify({owner:v("g1").trim(),repo:v("g2").trim(),path:v("g3").trim(),token:v("g4").trim()}));ghWarned=true;ghLoad(false).catch(e=>setStatus(e.message,"wa"))})}
const ghTick=()=>{if(src==="gh"&&!ghBusy&&!$("#dlg").open&&!document.hidden)ghLoad(true).catch(()=>{})};
/* ================= auth ================= */
const hashPw=async(p,salt)=>{const d=new TextEncoder().encode(salt+p);if(window.crypto&&crypto.subtle){const h=await crypto.subtle.digest("SHA-256",d);return[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,"0")).join("")}let h=5381;for(const b of d)h=(h*33^b)>>>0;return"f"+h};
const locked=()=>{if(Date.now()<lockUntil){toast("ลองผิดหลายครั้ง กรุณารอ 30 วินาที","er");return true}return false};
const failed=()=>{if(++fails>=5){lockUntil=Date.now()+30000;fails=0}toast("รหัสผ่านหรือชื่อผู้ใช้ไม่ถูกต้อง","er")};
const bumpA=()=>{clearTimeout(tA);if(admin)tA=setTimeout(()=>{admin=false;toast("ออกจากหลังบ้านอัตโนมัติ (ไม่มีการใช้งาน 10 นาที)");render()},600000)};
const bumpU=()=>{clearTimeout(tU);if(user)tU=setTimeout(logout,900000)};
function logout(){user=null;sessionStorage.removeItem("uid");cart=[];ci={};render()}
function loginDlg(){
  if(!S.users.some(u=>u.active!==false))return toast("ยังไม่มีผู้เบิกในระบบ ให้ผู้ดูแลเพิ่มในหลังบ้านก่อน","er");
  ask("เข้าสู่ระบบเพื่อเบิกของ",'<label>ชื่อผู้ใช้</label><input id="f1" autocomplete="username"><label>รหัสผ่าน</label><input id="f2" type="password" autocomplete="current-password">',()=>{(async()=>{
    if(locked())return;const u=S.users.find(x=>x.username===v("f1").trim().toLowerCase()&&x.active!==false);
    if(u&&await hashPw(v("f2"),u.salt)===u.hash){fails=0;user=u.id;sessionStorage.setItem("uid",u.id);$("#dlg").close();bumpU();render()}else failed()})();return false})}
/* ================= views: shared ================= */
const card="rounded-2xl border border-slate-200 bg-white shadow-sm dark:border-slate-700 dark:bg-slate-800";

:`<div class="mb-5 flex flex-wrap items-center gap-4 rounded-2xl border border-amber-200 bg-amber-50 p-4 text-amber-900 dark:border-amber-800 dark:bg-amber-900/20 dark:text-amber-200"><div class="text-2xl">${fa("lock")}</div><div class="mr-auto"><div class="font-semibold">เข้าสู่ระบบก่อนจึงจะเบิกของได้</div><div class="text-xs opacity-80">ใช้ชื่อผู้ใช้และรหัสผ่านที่ผู้ดูแลระบบให้ไว้</div></div><button class="p" data-act="login">เข้าสู่ระบบ</button></div>`}

function importItemsCsv(txt){
  const rows=csvParse(txt);if(rows.length<2)throw Error("ไฟล์ว่างหรือไม่มีแถวข้อมูล");
  const H=rows[0].map(h=>h.trim().toLowerCase()),col=(...n)=>H.findIndex(h=>n.includes(h));
  const X={cat:col("หมวด","หมวดหมู่","category","cat"),name:col("ชื่อรายการ","รายการ","name","item"),code:col("รหัสสินค้า","รหัส","code","sku"),unit:col("หน่วย","unit"),qty:col("จำนวน","จำนวนทั้งหมด","qty","quantity")};
  if(X.name<0)throw Error("ไม่พบคอลัมน์ “ชื่อรายการ” (หัวคอลัมน์: หมวด, ชื่อรายการ, รหัสสินค้า, หน่วย, จำนวน)");
  ensureLoaded();snapshot();let add=0,upd=0;
  rows.slice(1).forEach(r=>{const g=k=>X[k]>=0?(r[X[k]]||"").trim():"",name=g("name");if(!name)return;
    const cn=g("cat")||"ทั่วไป";let c=S.cats.find(x=>x.name===cn);if(!c){c={id:uid(),name:cn,icon:"box",items:[]};S.cats.push(c)}
    const code=g("code"),it=c.items.find(x=>x.name===name||(code&&x.code===code)),qty=parseFloat(g("qty").replace(/,/g,""));
    if(it){if(X.code>=0)it.code=code;if(X.unit>=0)it.unit=g("unit");if(!isNaN(qty))it.qty=qty;upd++}
    else{c.items.push({id:uid(),name,code,unit:g("unit"),qty:isNaN(qty)?0:qty});add++}});
  return{add,upd}}

    ask("เพิ่มลงใบเบิก",`<div class="font-semibold">${esc(i.name)}</div><div class="hint">คงเหลือ ${rem(i)} ${esc(i.unit)}${ex?` · อยู่ในใบเบิกแล้ว ${ex.amt}`:""}</div><label>จำนวนที่เบิก</label><input id="f1" type="number" min="0" step="any" value="${ex?ex.amt:""}">`,()=>{const n=+v("f1");if(!(n>0))return false;if(ex)ex.amt=n;else cart.push({item:id,amt:n});cartBar()})},
  cart:()=>me()?openCart():loginDlg(),
  print:()=>{if(!logF().length)return toast("ไม่มีรายการเบิกให้พิมพ์","er");
    ask("พิมพ์ใบเบิก / บันทึก PDF",`<label>ชื่อผู้เบิก (แสดงบนใบเบิกและช่องลงชื่อ)</label><input id="f1" list="whos" value="${esc(lf.who)}"><datalist id="whos">${whoList().map(w=>`<option value="${esc(w)}">`).join("")}</datalist><label>โครงการ / สถานที่ (ถ้ามี)</label><input id="f2" value="${esc(localStorage.getItem("lastsite")||"")}"><div class="hint">พิมพ์ตามรายการที่กรองอยู่ · ต้องการไฟล์ PDF ให้เลือกปลายทางเป็น “บันทึกเป็น PDF” ในหน้าต่างพิมพ์</div>`,()=>{if(!v("f1").trim())return toast("กรุณาระบุชื่อผู้เบิก","er")||false;localStorage.setItem("lastsite",v("f2").trim());const w=v("f1").trim(),st=v("f2").trim();setTimeout(()=>printSheet(w,st,null,lf.slip),50)})},
  "adm-go":async()=>{const p=$("#ap1").value;if(locked())return;
    if(!S.admin){if(p.length<4)return toast("รหัสอย่างน้อย 4 ตัว","er");if(p!==$("#ap2").value)return toast("รหัสยืนยันไม่ตรงกัน","er");const salt=uid()+uid();S.admin={salt,hash:await hashPw(p,salt)};persist()}
    else if(!await adminAuth(p))return failed();
    fails=0;admin=true;bumpA();render()},
  "adm-out":()=>{admin=false;location.hash="#/";render()},
  pwdlg:()=>ask("เปลี่ยนรหัสผ่านหลังบ้าน",'<label>รหัสเดิม</label><input id="f0" type="password"><label>รหัสใหม่ (อย่างน้อย 4 ตัว)</label><input id="f1" type="password"><label>ยืนยันรหัสใหม่</label><input id="f2" type="password">',()=>{(async()=>{
    if(!await adminAuth(v("f0")))return toast("รหัสเดิมไม่ถูกต้อง","er");if(v("f1").length<4)return toast("รหัสสั้นเกินไป","er");if(v("f1")!==v("f2"))return toast("รหัสยืนยันไม่ตรงกัน","er");
    const salt=uid()+uid();S.admin={salt,hash:await hashPw(v("f1"),salt)};$("#dlg").close();change();toast("เปลี่ยนรหัสผ่านแล้ว")})();return false}),
  addcat:()=>catDlg(),rencat:()=>catDlg(S.cats.find(c=>c.id===bcat)),
  delcat:()=>{const c=S.cats.find(x=>x.id===bcat);if(c&&confirm(`ลบหมวด “${c.name}” พร้อมรายการและประวัติการเบิกของรายการเหล่านี้?`)){const ids=c.items.map(i=>i.id);S.log=S.log.filter(l=>!ids.includes(l.item));S.cats=S.cats.filter(x=>x!==c);bcat=S.cats[0]?.id;tab=S.cats[0]?.id;change()}},
  additem:()=>itemDlg(S.cats.find(c=>c.id===bcat)),edititem:id=>{const f=find(id);itemDlg(f.c,f.i)},
  delitem:id=>{const{c,i}=find(id);if(confirm(`ลบ “${i.name}” และประวัติการเบิกของรายการนี้?`)){c.items=c.items.filter(x=>x!==i);S.log=S.log.filter(l=>l.item!==id);change()}},
  adduser:()=>userDlg(),edituser:id=>userDlg(S.users.find(x=>x.id===id)),
  deluser:id=>{const u=S.users.find(x=>x.id===id);if(confirm(`ลบผู้เบิก “${u.name}”? (ประวัติการเบิกเดิมยังอยู่)`)){S.users=S.users.filter(x=>x!==u);if(user===u.id)user=null;change()}},
  dellog:id=>{if(confirm("ยกเลิกรายการเบิกนี้?")){S.log=S.log.filter(l=>l.id!==id);change()}},
  "f-open":openFile,"f-save":saveAs,"gh-set":ghDlg,
  "gh-rf":()=>ghLoad(true).then(()=>toast("รีเฟรชแล้ว")).catch(e=>toast(e.message,"er")),
  "bk-gh":()=>ghBackup().catch(e=>toast("สำรองไม่สำเร็จ: "+e.message,"er")),
  "bk-json":()=>{dl(`stock-backup-${stamp()}.json`,JSON.stringify(S,null,1),"application/json");toast("ดาวน์โหลดไฟล์สำรองแล้ว")},
  "ex-items":()=>{const r=[["หมวด","ชื่อรายการ","รหัสสินค้า","หน่วย","จำนวน","เบิกใช้แล้ว","คงเหลือ"]];S.cats.forEach(c=>c.items.forEach(i=>r.push([c.name,i.name,i.code,i.unit,i.qty,used(i.id),rem(i)])));dl(`stock-items-${stamp()}.csv`,csvOut(r),"text/csv")},
  "ex-log":()=>{const r=[["เลขที่ใบเบิก","วันที่","หมวด","ชื่อรายการ","รหัสสินค้า","จำนวนเบิก","หน่วย","ผู้เบิก","โครงการ/สถานที่","หมายเหตุ"]];[...S.log].sort((a,b)=>a.date.localeCompare(b.date)).forEach(l=>{const f=find(l.item);r.push([l.slip||"",l.date,f?.c.name||"",f?.i.name||"(ลบแล้ว)",f?.i.code||"",l.amt,f?.i.unit||"",l.who||"",l.site||"",l.note||""])});dl(`stock-log-${stamp()}.csv`,csvOut(r),"text/csv")},
  tpl:()=>dl("แม่แบบนำเข้ารายการ.csv",csvOut([["หมวด","ชื่อรายการ","รหัสสินค้า","หน่วย","จำนวน"]]),"text/csv"),
  "im-json":async()=>{const f=await pick(".json,application/json");if(!f)return;
    try{const txt=await f.text(),d=norm(JSON.parse(txt));
      if(loaded){if(!confirm(`นำเข้าไฟล์ ${f.name}\n${d.cats.length} หมวด · ${d.cats.reduce((a,c)=>a+c.items.length,0)} รายการ · ${d.log.length} ประวัติ\n\nข้อมูลปัจจุบันจะถูกแทนที่ (ย้อนกลับได้ 1 ครั้ง) ต้องการดำเนินการต่อ?`))return;
        snapshot();if(!d.admin&&S.admin)d.admin=S.admin;S=d;tab=S.cats[0]?.id;bcat=tab;cart=[];if(!S.users.some(u=>u.id===user))user=null;change()}
      else{await useData(txt,null,ghMissing?"gh":null);persist()}toast("นำเข้า JSON เรียบร้อย")}catch(e){toast("นำเข้าไม่สำเร็จ: "+e.message,"er")}},
  "im-csv":async()=>{const f=await pick(".csv,text/csv");if(!f)return;
    try{const r=importItemsCsv(await f.text());tab=tab||S.cats[0]?.id;bcat=bcat||S.cats[0]?.id;change();toast(`นำเข้า CSV แล้ว: เพิ่มใหม่ ${r.add} · อัปเดต ${r.upd} รายการ`)}catch(e){toast("นำเข้าไม่สำเร็จ: "+e.message,"er")}},
  undo:()=>{const t=localStorage.getItem("stock-undo");if(!t)return;if(!confirm("ย้อนกลับไปก่อนการนำเข้าครั้งล่าสุด?"))return;S=norm(JSON.parse(t));localStorage.removeItem("stock-undo");tab=S.cats[0]?.id;bcat=tab;change();toast("ย้อนกลับแล้ว")},
  reconnect:async()=>{try{if(await lastH.requestPermission({mode:"readwrite"})!=="granted")return;await useData(await(await lastH.getFile()).text(),lastH)}catch(e){toast("เชื่อมต่อไม่สำเร็จ: "+e.message,"er")}},
  usebackup:()=>useData(localStorage.getItem("stock-v1"),null,ghMissing?"gh":null).catch(e=>toast(e.message,"er")),
  blank:()=>useData('{"cats":[]}',null,ghMissing?"gh":null).then(persist)
};
/* ================= events ================= */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-m]");document.querySelectorAll(".menu").forEach(m=>{if(!t||m.id!=="m-"+t.dataset.m)m.classList.remove("open")});if(t)$("#m-"+t.dataset.m).classList.toggle("open");
  bumpU();if(admin)bumpA();
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;const a=b.dataset.act;
  if(ADM.has(a)&&!admin)return;if(NEEDADM.has(a)&&loaded&&!admin)return;
  A[a]?.(b.dataset.id)});
document.addEventListener("input",e=>{if(e.target.id==="q"){q=e.target.value;const p=e.target.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(p,p)}});
document.addEventListener("change",e=>{const id=e.target.id||"";if(id.startsWith("lf-")){lf[id.slice(3)]=e.target.value;render()}});
document.addEventListener("keydown",e=>{if(e.key!=="Enter")return;if(["ap1","ap2"].includes(e.target.id))A["adm-go"]()});
$("#frm").onkeydown=e=>{if(e.key==="Enter"&&e.target.tagName==="INPUT"){e.preventDefault();$("#ok")?.click()}};
$("#frm").onclick=e=>{const ic=e.target.closest("[data-ic]");if(ic){$("#f2").value=ic.dataset.ic;$("#icp").innerHTML=fa(ic.dataset.ic);document.querySelectorAll("[data-ic]").forEach(b=>b.classList.toggle("ring-2",b===ic));return}
  const r=e.target.closest("[data-rm]");if(r){cart.splice(+r.dataset.rm,1);openCart()}};
$("#frm").oninput=e=>{const t=e.target,k={c1:"who",c2:"date",c3:"site",c4:"note"}[t.id];if(k)ci[k]=t.value;if(t.dataset.ci!=null)cart[+t.dataset.ci].amt=+t.value||0;
  if(t.id==="f2"&&$("#icp"))$("#icp").innerHTML=isFa(t.value.trim())?fa(t.value.trim()):esc(t.value)};
window.addEventListener("hashchange",render);
setInterval(ghTick,60000);document.addEventListener("visibilitychange",ghTick);
window.onbeforeunload=e=>{if(loaded&&!src&&!fh){e.preventDefault();e.returnValue=""}};
async function init(){
  if(online()){try{await ghLoad(false)}catch(e){setStatus("โหลดออนไลน์ไม่สำเร็จ: "+e.message,"wa")}if(loaded)return}
  try{const r=await fetch("stock.json",{cache:"no-store"});if(r.ok){await useData(await r.text(),null);setStatus("ออฟไลน์ · โหลดจาก stock.json (ยังไม่เชื่อมไฟล์สำหรับบันทึก)","wa");return}}catch(e){}
  setStatus("ยังไม่ได้โหลดข้อมูล","wa");lastH=await idbGet();render()}
render();init();
</script></body></html>
