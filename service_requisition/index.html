<!DOCTYPE html>
<html lang="th" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบเบิกของติดตั้ง - Material Design 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      fontFamily: { sans: ['"Prompt"', 'sans-serif'] },
      colors: {
        theme: {
          primary: 'var(--m3-primary)',
          onPrimary: 'var(--m3-on-primary)',
          primaryContainer: 'var(--m3-primary-container)',
          onPrimaryContainer: 'var(--m3-on-primary-container)',
          surface: 'var(--m3-surface)',
          onSurface: 'var(--m3-on-surface)',
          surfaceVariant: 'var(--m3-surface-variant)',
          onSurfaceVariant: 'var(--m3-on-surface-variant)',
          outline: 'var(--m3-outline)',
          outlineVariant: 'var(--m3-outline-variant)'
        }
      }
    }
  }
}
</script>
<style>
:root {
  --m3-primary: #4f46e5;
  --m3-on-primary: #ffffff;
  --m3-primary-container: #e0e7ff;
  --m3-on-primary-container: #1e1b4b;
  --m3-surface: #f8fafc;
  --m3-on-surface: #0f172a;
  --m3-surface-variant: #f1f5f9;
  --m3-on-surface-variant: #475569;
  --m3-outline: #cbd5e1;
  --m3-outline-variant: #e2e8f0;
}

/* Material 3 Palette Themes */
[data-theme="indigo"] {
  --m3-primary: #4f46e5; --m3-on-primary: #ffffff;
  --m3-primary-container: #e0e7ff; --m3-on-primary-container: #1e1b4b;
}
[data-theme="emerald"] {
  --m3-primary: #059669; --m3-on-primary: #ffffff;
  --m3-primary-container: #d1fae5; --m3-on-primary-container: #064e3b;
}
[data-theme="rose"] {
  --m3-primary: #e11d48; --m3-on-primary: #ffffff;
  --m3-primary-container: #ffe4e6; --m3-on-primary-container: #881337;
}
[data-theme="amber"] {
  --m3-primary: #d97706; --m3-on-primary: #ffffff;
  --m3-primary-container: #fef3c7; --m3-on-primary-container: #78350f;
}
[data-theme="violet"] {
  --m3-primary: #7c3aed; --m3-on-primary: #ffffff;
  --m3-primary-container: #ede9fe; --m3-on-primary-container: #4c1d95;
}
[data-theme="slate"] {
  --m3-primary: #475569; --m3-on-primary: #ffffff;
  --m3-primary-container: #f1f5f9; --m3-on-primary-container: #0f172a;
}

body {
  background-color: var(--m3-surface);
  color: var(--m3-on-surface);
  font-family: 'Prompt', sans-serif;
  transition: background-color 0.2s, color 0.2s;
}

.m3-card {
  background-color: #ffffff;
  border: 1px solid var(--m3-outline-variant);
  border-radius: 1.5rem;
  transition: all 0.2s cubic-bezier(0, 0, 0.2, 1);
}
.dark .m3-card {
  background-color: #1e293b;
  border-color: #334155;
}

.m3-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  padding: 0.625rem 1.25rem;
  border-radius: 9999px;
  font-weight: 500;
  font-size: 0.875rem;
  transition: all 0.2s;
  cursor: pointer;
}
.m3-btn-primary {
  background-color: var(--m3-primary);
  color: var(--m3-on-primary);
}
.m3-btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
.m3-btn-tonal {
  background-color: var(--m3-primary-container);
  color: var(--m3-on-primary-container);
}
.m3-btn-tonal:hover { opacity: 0.85; }
.m3-btn-outlined {
  border: 1px solid var(--m3-outline);
  color: var(--m3-primary);
}
.m3-btn-outlined:hover { background-color: var(--m3-primary-container); }

.m3-input {
  width: 100%;
  border-radius: 0.75rem;
  border: 1px solid var(--m3-outline);
  background: transparent;
  padding: 0.625rem 1rem;
  font-size: 0.875rem;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.m3-input:focus {
  border-color: var(--m3-primary);
  box-shadow: 0 0 0 2px var(--m3-primary-container);
}

dialog::backdrop {
  background: rgba(15, 23, 42, 0.6);
  backdrop-filter: blur(4px);
}

#pr { display: none; }
@media print {
  body { background: #fff !important; color: #000 !important; }
  #app, dialog, #cartbar, #toast { display: none !important; }
  #pr { display: block; font-size: 13px; }
  #pr h2 { font-size: 20px; font-weight: 700; text-align: center; margin-bottom: 12px; }
  #pr table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  #pr th, #pr td { border: 1px solid #000; padding: 6px; font-size: 12px; }
  #pr .sg { display: flex; justify-content: space-around; margin-top: 50px; text-align: center; }
  #pr .sg i { display: block; border-top: 1px dotted #000; margin-top: 30px; padding-top: 4px; font-style: normal; }
}
</style>
</head>
<body class="h-full antialiased selection:bg-indigo-500 selection:text-white">

<div id="app" class="min-h-full flex flex-col"></div>
<div id="pr"></div>
<div id="cartbar"></div>
<div id="toast" class="pointer-events-none fixed bottom-6 right-6 z-50 flex flex-col gap-2"></div>

<dialog id="dlg" class="m3-card p-6 shadow-2xl backdrop:backdrop-blur-sm w-[92vw] max-w-md rounded-3xl border-0">
  <form method="dialog" id="frm"></form>
</dialog>

<script>
/* ================= Config & State ================= */
const $ = s => document.querySelector(s);
const v = id => $("#"+id)?.value || "";
const esc = s => String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const today = () => new Date().toISOString().slice(0, 10);
const fa = (n, x="") => `<i class="fa-solid fa-${n} ${x}"></i>`;

// Dynamic Path Config
const DEFAULT_PATH = "database/stock-data.json";

// Theme Palette State
let currentTheme = localStorage.getItem("m3-theme") || "indigo";
function setTheme(theme) {
  currentTheme = theme;
  localStorage.setItem("m3-theme", theme);
  document.documentElement.setAttribute("data-theme", theme);
  render();
}
document.documentElement.setAttribute("data-theme", currentTheme);

// Application Clean State (เริ่มต้นแบบไม่มีข้อมูลสินค้าค้างใน HTML)
let S = { cats: [], log: [], users: [], trash: [], seq: 0 };
let loaded = false, src = null, fh = null, admin = false, user = null, cart = [], ci = {}, tab = "all", bcat = null, q = "";
let stat = { t: "กำลังเชื่อมต่อ…", c: "" };

function setStatus(t, c) { stat = { t, c: c || "" }; const e = $("#st"); if (e) { e.textContent = t; } }
function toast(m, type="ok") {
  const t = document.createElement("div");
  t.className = `pointer-events-auto flex items-center gap-2 rounded-2xl px-5 py-3 text-sm font-medium text-white shadow-xl ${type==="er" ? "bg-red-600" : "bg-emerald-600"}`;
  t.innerHTML = `${fa(type==="er"?"circle-exclamation":"check-circle")} ${m}`;
  $("#toast").append(t);
  setTimeout(() => t.remove(), 3500);
}

function ask(title, html, ok, extra) {
  $("#frm").innerHTML = `<h3 class="text-xl font-bold mb-4">${title}</h3>${html}<div class="mt-6 flex justify-end gap-2">${extra||""}<button type="button" class="m3-btn m3-btn-outlined" id="cn">ยกเลิก</button><button class="m3-btn m3-btn-primary" id="ok" type="button">ตกลง</button></div>`;
  if (!$("#dlg").open) $("#dlg").showModal();
  $("#cn").onclick = () => $("#dlg").close();
  $("#ok").onclick = () => { if (ok() !== false) $("#dlg").close(); };
}

/* ================= Storage & Data Normalization ================= */
function norm(d) {
  if (!d || typeof d !== 'object') d = {};
  d.cats = Array.isArray(d.cats) ? d.cats : [];
  d.log = Array.isArray(d.log) ? d.log : [];
  d.users = Array.isArray(d.users) ? d.users : [];
  d.trash = Array.isArray(d.trash) ? d.trash : [];
  d.seq = d.seq || 0;
  return d;
}

async function useData(txt, h, sr) {
  try {
    const d = norm(JSON.parse(txt));
    S = d; fh = h || null; src = sr || (h ? "file" : null); loaded = true;
    try { localStorage.setItem("stock-v1", JSON.stringify(S)); } catch(e){}
    setStatus(fh ? `เชื่อมต่อไฟล์ ${fh.name}` : "โหลดข้อมูลออนไลน์สำเร็จ", "ok");
  } catch(e) {
    toast("รูปแบบไฟล์ JSON ไม่ถูกต้อง", "er");
  }
  render();
}

/* ================= GitHub Sync ================= */
const ghCfg = () => {
  try { return JSON.parse(localStorage.getItem("gh-cfg") || "{}"); } catch(e) { return {}; }
};

async function ghLoad() {
  const c = ghCfg();
  if (!c.owner || !c.repo) return false;
  try {
    const filePath = c.path || DEFAULT_PATH;
    const url = `https://api.github.com/repos/${c.owner}/${c.repo}/contents/${filePath}?t=${Date.now()}`;
    const h = { Accept: "application/vnd.github+json" };
    if (c.token) h.Authorization = "Bearer " + c.token;
    const r = await fetch(url, { headers: h, cache: "no-store" });
    if (r.ok) {
      const j = await r.json();
      const txt = decodeURIComponent(escape(atob(j.content.replace(/\s/g, ""))));
      await useData(txt, null, "gh");
      return true;
    }
  } catch(e) { console.error(e); }
  return false;
}

/* ================= Routing & Views ================= */
const R = () => {
  const h = location.hash.replace(/^#\/?/, "").split("/");
  return h[0] === "admin" ? { area: "back", page: h[1] || "dash" } : { area: "front", page: h[0] || "stock" };
};

function headerUI() {
  return `
  <header class="sticky top-0 z-30 border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3">
      <div class="flex items-center gap-3">
        <div class="grid h-10 w-10 place-items-center rounded-2xl bg-theme-primary text-white shadow-md">
          ${fa("boxes-stacked", "text-lg")}
        </div>
        <div>
          <h1 class="text-base font-bold leading-tight">ระบบเบิกของติดตั้ง</h1>
          <span id="st" class="text-xs text-slate-500">${esc(stat.t)}</span>
        </div>
      </div>

      <!-- Color Theme Selector -->
      <div class="flex items-center gap-2">
        <div class="flex items-center gap-1.5 rounded-full bg-slate-100 dark:bg-slate-800 p-1.5 border border-slate-200 dark:border-slate-700">
          ${['indigo', 'emerald', 'rose', 'amber', 'violet', 'slate'].map(t => `
            <button data-act="set-theme" data-id="${t}" class="h-5 w-5 rounded-full transition-transform ${currentTheme===t?'scale-125 ring-2 ring-offset-2 ring-slate-400':''}" style="background-color: ${t==='indigo'?'#4f46e5':t==='emerald'?'#059669':t==='rose'?'#e11d48':t==='amber'?'#d97706':t==='violet'?'#7c3aed':'#475569'}"></button>
          `).join('')}
        </div>
        <a href="#/admin" class="m3-btn m3-btn-tonal !py-1.5 !px-3 text-xs">${fa("user-shield")} หลังบ้าน</a>
      </div>
    </div>
  </header>`;
}

function vHome() {
  const allItems = S.cats.flatMap(c => c.items || []);
  return `
  <div class="mx-auto max-w-7xl px-4 py-6">
    <!-- Hero Banner -->
    <div class="m3-card p-6 md:p-8 bg-gradient-to-br from-indigo-500/10 via-purple-500/5 to-transparent mb-6">
      <div class="flex flex-wrap items-center justify-between gap-4">
        <div>
          <span class="inline-flex items-center gap-1.5 rounded-full bg-theme-primaryContainer px-3 py-1 text-xs font-semibold text-theme-onPrimaryContainer mb-2">
            ${fa("cloud")} Online / Offline JSON Direct
          </span>
          <h2 class="text-2xl font-bold">ระบบจัดการเบิกวัสดุอุปกรณ์</h2>
          <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">เริ่มต้นใช้งานด้วยการเชื่อมต่อไฟล์ database/stock-data.json หรือดึงข้อมูลผ่าน GitHub API</p>
        </div>
        <div class="flex flex-wrap gap-2">
          <button data-act="gh-set" class="m3-btn m3-btn-primary">${fa("cloud")} ตั้งค่า GitHub API</button>
          <button data-act="f-open" class="m3-btn m3-btn-tonal">${fa("folder-open")} เปิดไฟล์ .json</button>
        </div>
      </div>
    </div>

    <!-- Empty State / Data View -->
    ${allItems.length === 0 ? `
      <div class="m3-card p-12 text-center">
        <div class="mx-auto grid h-16 w-16 place-items-center rounded-full bg-slate-100 dark:bg-slate-800 text-3xl text-slate-400 mb-4">
          ${fa("box-open")}
        </div>
        <h3 class="text-lg font-bold">ยังไม่มีข้อมูลสินค้าในระบบ</h3>
        <p class="text-sm text-slate-500 mt-1 max-w-md mx-auto">ระบบเริ่มต้นแบบสะอาดโดยไม่มีข้อมูลตัวอย่างฝังในโค้ด คุณสามารถเชื่อมต่อไฟล์ JSON หรือตั้งค่า GitHub API เพื่อดึงข้อมูลสินค้ามาแสดงผลได้ทันที</p>
        <div class="mt-6 flex justify-center gap-3">
          <a href="#/admin" class="m3-btn m3-btn-primary">${fa("plus")} จัดการในหลังบ้าน</a>
        </div>
      </div>
    ` : `
      <div class="m3-card p-6">
        <h3 class="text-lg font-bold mb-4">รายการสินค้าทั้งหมด (${allItems.length} รายการ)</h3>
      </div>
    `}
  </div>`;
}

function vBackOffice() {
  const c = ghCfg();
  return `
  <div class="mx-auto max-w-7xl px-4 py-6">
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-xl font-bold flex items-center gap-2">${fa("user-shield")} การจัดการระบบหลังบ้าน</h2>
      <a href="#/" class="m3-btn m3-btn-outlined text-xs">${fa("arrow-left")} กลับหน้าหลัก</a>
    </div>

    <div class="grid gap-6 md:grid-cols-2">
      <div class="m3-card p-6">
        <h3 class="font-bold text-base mb-2 flex items-center gap-2">${fa("cloud")} เชื่อมต่อ GitHub API</h3>
        <p class="text-xs text-slate-500 mb-4">ดึงและบันทึกข้อมูลสินค้าไปยังไฟล์ <code class="bg-slate-100 dark:bg-slate-800 px-1.5 py-0.5 rounded text-theme-primary">database/stock-data.json</code> บน GitHub Repository โดยตรง</p>
        <button data-act="gh-set" class="m3-btn m3-btn-primary w-full">${fa("gear")} ตั้งค่า GitHub Connection</button>
      </div>

      <div class="m3-card p-6">
        <h3 class="font-bold text-base mb-2 flex items-center gap-2">${fa("file-import")} นำเข้า / ส่งออกข้อมูล JSON</h3>
        <p class="text-xs text-slate-500 mb-4">สำรองข้อมูลหรือนำเข้าไฟล์ stock-data.json จากเครื่องของคุณ</p>
        <div class="flex gap-2">
          <button data-act="f-open" class="m3-btn m3-btn-tonal flex-1">${fa("folder-open")} เปิดไฟล์ JSON</button>
          <button data-act="bk-json" class="m3-btn m3-btn-outlined flex-1">${fa("download")} ดาวน์โหลด JSON</button>
        </div>
      </div>
    </div>
  </div>`;
}

/* ================= Render App ================= */
function render() {
  const app = $("#app");
  const r = R();
  if (r.area === "back") {
    app.innerHTML = headerUI() + vBackOffice();
  } else {
    app.innerHTML = headerUI() + vHome();
  }
}

/* ================= Event Listeners ================= */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act;
  const id = b.dataset.id;

  if (act === "set-theme") setTheme(id);
  if (act === "gh-set") {
    const c = ghCfg();
    ask("ตั้งค่า GitHub API Online", `
      <label class="block text-xs font-semibold mb-1">Owner (ชื่อบัญชี GitHub)</label>
      <input id="g1" class="m3-input mb-3" value="${esc(c.owner||"")}" placeholder="เช่น myusername">
      
      <label class="block text-xs font-semibold mb-1">Repository Name</label>
      <input id="g2" class="m3-input mb-1" value="${esc(c.repo||"")}" placeholder="เช่น my-stock-repo">
      <p class="text-[11px] text-slate-400 mb-3">*ใส่เฉพาะชื่อ Repository เท่านั้น ระบบจะอ้างอิงไปที่โฟลเดอร์ database/stock-data.json ให้อัตโนมัติ</p>
      
      <label class="block text-xs font-semibold mb-1">Personal Access Token (Fine-grained token)</label>
      <input id="g3" type="password" class="m3-input mb-1" value="${esc(c.token||"")}" placeholder="github_pat_...">
    `, () => {
      const owner = v("g1").trim(), repo = v("g2").trim(), token = v("g3").trim();
      if (!owner || !repo) { toast("กรุณากรอกข้อมูล Owner และ Repo", "er"); return false; }
      localStorage.setItem("gh-cfg", JSON.stringify({ owner, repo, path: DEFAULT_PATH, token }));
      ghLoad().then(ok => {
        if (ok) toast("เชื่อมต่อ GitHub สำเร็จ!");
        else toast("ไม่สามารถโหลดไฟล์ข้อมูลจาก GitHub ได้", "er");
      });
    });
  }
  if (act === "f-open") {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = ".json";
    input.onchange = e => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = ev => useData(ev.target.result, file, "file");
        reader.readAsText(file);
      }
    };
    input.click();
  }
  if (act === "bk-json") {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(S, null, 2));
    const dlAnchor = document.createElement('a');
    dlAnchor.setAttribute("href", dataStr);
    dlAnchor.setAttribute("download", `stock-data-${today()}.json`);
    document.body.appendChild(dlAnchor);
    dlAnchor.click();
    dlAnchor.remove();
    toast("ดาวน์โหลดไฟล์สำรองเรียบร้อย");
  }
});

window.addEventListener("hashchange", render);

// Auto Init Connection
async function init() {
  const loadedGh = await ghLoad();
  if (!loadedGh) {
    setStatus("ยังไม่ได้เชื่อมต่อแหล่งข้อมูล JSON", "wa");
    render();
  }
}

init();
</script>
</body>
</html>
